schema_version: 1

context:
  version: 2026.10.1
  python_min: '3.10'

package:
  name: scikit-hep
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scikit-hep/scikit_hep-${{ version }}.tar.gz
  sha256: e3551ff64b038b67f5d93879066f5a0ad9871d3ab11ec0115ec4d8f79a0584ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=62.6
  run:
    - python >=${{ python_min }}
    - awkward ~=2.14.0
    - decaylanguage ~=1.1.0
    - hepstats ~=0.10.0
    - hepunits ~=2.4.0
    - hist ~=2.12.0
    - histoprint ~=2.7.0
    - iminuit ~=2.33.0
    - matplotlib-base >3.4.0
    - mplhep ~=1.2.0
    - numpy >=1.13.1
    - particle ~=1.0.0
    - pylhe ~=2.1.0
    - resample ~=1.10.0
    - uproot ~=5.7.0
    - vector ~=1.9.0
tests:
  - python:
      imports:
        - skhep
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Metapackage of Scikit-HEP project tools for Particle Physics.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/scikit-hep/
  repository: https://github.com/scikit-hep/scikit-hep/

extra:
  recipe-maintainers:
    - matthewfeickert
    - chrisburr
    - eduardo-rodrigues
    - henryiii
